<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune - Multiplayer Quiz Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            text-align: center;
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category {
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 30px;
            padding: 10px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
        }

        .puzzle-board {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .puzzle-line {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .letter-tile {
            width: 45px;
            height: 55px;
            background: #fff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .letter-tile.hidden {
            background: linear-gradient(145deg, #4a5568, #2d3748);
            color: transparent;
        }

        .letter-tile.revealed {
            animation: revealLetter 0.5s ease;
        }

        .letter-tile.space {
            background: transparent;
            box-shadow: none;
        }

        @keyframes revealLetter {
            0% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }

        .wheel-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            position: relative;
        }

        .wheel {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            border: 15px solid #FFD700;
            position: relative;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            background: conic-gradient(
                from 0deg,
                #FF6B6B 0deg 30deg,
                #4ECDC4 30deg 60deg,
                #45B7D1 60deg 90deg,
                #96CEB4 90deg 120deg,
                #FFEAA7 120deg 150deg,
                #DFE6E9 150deg 180deg,
                #FF6B6B 180deg 210deg,
                #4ECDC4 210deg 240deg,
                #45B7D1 240deg 270deg,
                #96CEB4 270deg 300deg,
                #FFEAA7 300deg 330deg,
                #DFE6E9 330deg 360deg
            );
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.3);
        }

        .wheel::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            z-index: 10;
        }

        .wheel-segment {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
            font-weight: bold;
            font-size: 1.2em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .wheel-pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #FFD700;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            z-index: 20;
        }

        .spin-button {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #333;
            border: none;
            padding: 15px 40px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            margin: 20px 0;
        }

        .spin-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .letter-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .letter-input input {
            width: 60px;
            height: 60px;
            font-size: 2em;
            text-align: center;
            text-transform: uppercase;
            border: 3px solid #FFD700;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
        }

        .action-button {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-button.buy-vowel {
            background: linear-gradient(145deg, #4ECDC4, #45B7D1);
        }

        .action-button.solve {
            background: linear-gradient(145deg, #96CEB4, #88D8B0);
        }

        .teams {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .team {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .team.active {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .team h3 {
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .team-score {
            font-size: 2em;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .team-round-score {
            font-size: 1.2em;
            color: #4ECDC4;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .message-box.success {
            border-color: #96CEB4;
            background: rgba(150, 206, 180, 0.2);
        }

        .message-box.error {
            border-color: #FF6B6B;
            background: rgba(255, 107, 107, 0.2);
        }

        .used-letters {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .used-letters h4 {
            margin-bottom: 10px;
        }

        .used-letters-grid {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .used-letter {
            width: 35px;
            height: 35px;
            background: rgba(255, 107, 107, 0.3);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid rgba(255, 107, 107, 0.5);
        }

        .solve-input {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
        }

        .solve-input input {
            flex: 1;
            max-width: 500px;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #FFD700;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
        }

        .new-game-button {
            background: linear-gradient(145deg, #96CEB4, #88D8B0);
            color: #333;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(150, 206, 180, 0.4);
            transition: all 0.3s ease;
        }

        .new-game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 206, 180, 0.6);
        }

        .game-over {
            background: rgba(255, 215, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            border: 3px solid #FFD700;
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .wheel {
                width: 250px;
                height: 250px;
            }

            .letter-tile {
                width: 35px;
                height: 45px;
                font-size: 1.4em;
            }

            .teams {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎡 WHEEL OF FORTUNE 🎡</h1>

        <div class="category" id="category"></div>

        <div class="message-box" id="messageBox">Spin the wheel to start!</div>

        <div class="teams" id="teams"></div>

        <div class="puzzle-board" id="puzzleBoard"></div>

        <div class="used-letters">
            <h4>Used Letters:</h4>
            <div class="used-letters-grid" id="usedLetters"></div>
        </div>

        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <div style="text-align: center;">
            <button class="spin-button" id="spinButton">SPIN THE WHEEL</button>
        </div>

        <div class="letter-input">
            <input type="text" id="letterInput" maxlength="1" placeholder="?" disabled>
            <button class="action-button" id="guessButton" disabled>Guess Letter</button>
            <button class="action-button buy-vowel" id="buyVowelButton" disabled>Buy Vowel ($250)</button>
        </div>

        <div class="solve-input">
            <input type="text" id="solveInput" placeholder="Type your solution here..." disabled>
            <button class="action-button solve" id="solveButton" disabled>Solve Puzzle</button>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="new-game-button" id="newGameButton">New Game</button>
        </div>
    </div>

    <script>
        // Game Configuration
        const WHEEL_VALUES = [
            500, 600, 700, 800, 900, 300, 500, 600, 'BANKRUPT', 700, 800, 500
        ];

        const PUZZLES = [
            { category: "Movie Quotes", phrase: "I'LL BE BACK" },
            { category: "Movie Quotes", phrase: "MAY THE FORCE BE WITH YOU" },
            { category: "Before & After", phrase: "WHEEL OF CHEESE" },
            { category: "Before & After", phrase: "FORTUNE COOKIE MONSTER" },
            { category: "Food & Drink", phrase: "PEPPERONI PIZZA" },
            { category: "Food & Drink", phrase: "CHOCOLATE CHIP COOKIES" },
            { category: "Movie Quotes", phrase: "YOU CAN'T HANDLE THE TRUTH" },
            { category: "Before & After", phrase: "BREAKING BAD NEWS BEARS" },
            { category: "Food & Drink", phrase: "BACON AND EGGS" },
            { category: "Before & After", phrase: "SPINNING WHEEL OF FORTUNE" }
        ];

        const VOWELS = ['A', 'E', 'I', 'O', 'U'];
        const VOWEL_COST = 250;

        // Game State
        let currentPuzzle = null;
        let currentTeam = 0;
        let teams = [
            { name: 'Team 1', totalScore: 0, roundScore: 0 },
            { name: 'Team 2', totalScore: 0, roundScore: 0 },
            { name: 'Team 3', totalScore: 0, roundScore: 0 }
        ];
        let revealedLetters = new Set();
        let usedLetters = new Set();
        let currentWheelValue = 0;
        let spinning = false;
        let waitingForGuess = false;
        let gameOver = false;

        // DOM Elements
        const wheelElement = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const letterInput = document.getElementById('letterInput');
        const guessButton = document.getElementById('guessButton');
        const buyVowelButton = document.getElementById('buyVowelButton');
        const solveInput = document.getElementById('solveInput');
        const solveButton = document.getElementById('solveButton');
        const messageBox = document.getElementById('messageBox');
        const puzzleBoard = document.getElementById('puzzleBoard');
        const categoryElement = document.getElementById('category');
        const teamsElement = document.getElementById('teams');
        const usedLettersElement = document.getElementById('usedLetters');
        const newGameButton = document.getElementById('newGameButton');

        // Initialize Game
        function initGame() {
            currentPuzzle = PUZZLES[Math.floor(Math.random() * PUZZLES.length)];
            currentTeam = 0;
            teams = [
                { name: 'Team 1', totalScore: 0, roundScore: 0 },
                { name: 'Team 2', totalScore: 0, roundScore: 0 },
                { name: 'Team 3', totalScore: 0, roundScore: 0 }
            ];
            revealedLetters = new Set();
            usedLetters = new Set();
            currentWheelValue = 0;
            spinning = false;
            waitingForGuess = false;
            gameOver = false;

            renderPuzzle();
            renderTeams();
            renderUsedLetters();
            updateMessage('Spin the wheel to start!', '');
            categoryElement.textContent = currentPuzzle.category;

            spinButton.disabled = false;
            letterInput.disabled = true;
            guessButton.disabled = true;
            buyVowelButton.disabled = true;
            solveInput.disabled = false;
            solveButton.disabled = false;
        }

        // Render Puzzle Board
        function renderPuzzle() {
            puzzleBoard.innerHTML = '';
            const words = currentPuzzle.phrase.split(' ');

            words.forEach(word => {
                const line = document.createElement('div');
                line.className = 'puzzle-line';

                for (let char of word) {
                    const tile = document.createElement('div');
                    tile.className = 'letter-tile';

                    if (char === ' ') {
                        tile.className += ' space';
                    } else if (revealedLetters.has(char)) {
                        tile.textContent = char;
                        tile.className += ' revealed';
                    } else {
                        tile.className += ' hidden';
                    }

                    line.appendChild(tile);
                }

                puzzleBoard.appendChild(line);
            });
        }

        // Render Teams
        function renderTeams() {
            teamsElement.innerHTML = '';
            teams.forEach((team, index) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team' + (index === currentTeam ? ' active' : '');
                teamDiv.innerHTML = `
                    <h3>${team.name}</h3>
                    <div class="team-score">$${team.totalScore}</div>
                    <div class="team-round-score">Round: $${team.roundScore}</div>
                `;
                teamsElement.appendChild(teamDiv);
            });
        }

        // Render Used Letters
        function renderUsedLetters() {
            usedLettersElement.innerHTML = '';
            Array.from(usedLetters).sort().forEach(letter => {
                const letterDiv = document.createElement('div');
                letterDiv.className = 'used-letter';
                letterDiv.textContent = letter;
                usedLettersElement.appendChild(letterDiv);
            });
        }

        // Update Message
        function updateMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = 'message-box';
            if (type) messageBox.className += ' ' + type;
        }

        // Spin Wheel
        spinButton.addEventListener('click', () => {
            if (spinning || gameOver) return;

            spinning = true;
            spinButton.disabled = true;

            const spins = 5 + Math.random() * 5;
            const randomIndex = Math.floor(Math.random() * WHEEL_VALUES.length);
            const segmentAngle = 360 / WHEEL_VALUES.length;
            const targetAngle = (spins * 360) + (randomIndex * segmentAngle);

            wheelElement.style.transform = `rotate(${targetAngle}deg)`;

            setTimeout(() => {
                const value = WHEEL_VALUES[randomIndex];
                currentWheelValue = value;

                if (value === 'BANKRUPT') {
                    updateMessage('💥 BANKRUPT! You lose your round score!', 'error');
                    teams[currentTeam].roundScore = 0;
                    renderTeams();

                    setTimeout(() => {
                        switchTeam();
                        spinning = false;
                    }, 2000);
                } else {
                    updateMessage(`You spun $${value}! Guess a consonant or buy a vowel.`, 'success');
                    waitingForGuess = true;
                    letterInput.disabled = false;
                    guessButton.disabled = false;
                    buyVowelButton.disabled = teams[currentTeam].roundScore < VOWEL_COST;
                    letterInput.focus();
                    spinning = false;
                }
            }, 3000);
        });

        // Guess Letter
        guessButton.addEventListener('click', () => {
            const letter = letterInput.value.toUpperCase();
            if (!letter || letter.length !== 1) {
                updateMessage('Please enter a valid letter!', 'error');
                return;
            }

            if (VOWELS.includes(letter)) {
                updateMessage('That\'s a vowel! Use "Buy Vowel" button instead.', 'error');
                return;
            }

            guessLetter(letter, currentWheelValue);
        });

        // Buy Vowel
        buyVowelButton.addEventListener('click', () => {
            const letter = letterInput.value.toUpperCase();
            if (!letter || letter.length !== 1) {
                updateMessage('Please enter a valid vowel!', 'error');
                return;
            }

            if (!VOWELS.includes(letter)) {
                updateMessage('That\'s not a vowel! Vowels are A, E, I, O, U.', 'error');
                return;
            }

            if (teams[currentTeam].roundScore < VOWEL_COST) {
                updateMessage(`Not enough money! You need $${VOWEL_COST}.`, 'error');
                return;
            }

            teams[currentTeam].roundScore -= VOWEL_COST;
            renderTeams();
            guessLetter(letter, 0);
        });

        // Guess Letter Logic
        function guessLetter(letter, value) {
            if (usedLetters.has(letter)) {
                updateMessage('That letter was already used!', 'error');
                return;
            }

            usedLetters.add(letter);
            letterInput.value = '';
            letterInput.disabled = true;
            guessButton.disabled = true;
            buyVowelButton.disabled = true;
            waitingForGuess = false;
            spinButton.disabled = false;
            renderUsedLetters();

            const count = (currentPuzzle.phrase.match(new RegExp(letter, 'g')) || []).length;

            if (count > 0) {
                revealedLetters.add(letter);
                renderPuzzle();

                const earned = value * count;
                teams[currentTeam].roundScore += earned;
                renderTeams();

                updateMessage(`✅ Correct! Found ${count} ${letter}'s! You earned $${earned}. Spin again or solve!`, 'success');

                if (checkPuzzleSolved()) {
                    endRound(true);
                }
            } else {
                updateMessage(`❌ Sorry, no ${letter}'s in the puzzle. Next team's turn!`, 'error');
                setTimeout(() => switchTeam(), 2000);
            }
        }

        // Switch Team
        function switchTeam() {
            currentTeam = (currentTeam + 1) % teams.length;
            renderTeams();
            updateMessage(`${teams[currentTeam].name}'s turn! Spin the wheel!`, '');
            spinButton.disabled = false;
            letterInput.disabled = true;
            guessButton.disabled = true;
            buyVowelButton.disabled = true;
            waitingForGuess = false;
        }

        // Check if Puzzle Solved
        function checkPuzzleSolved() {
            const puzzleLetters = new Set(currentPuzzle.phrase.replace(/\s/g, '').split(''));
            return Array.from(puzzleLetters).every(letter => revealedLetters.has(letter));
        }

        // Solve Puzzle
        solveButton.addEventListener('click', () => {
            const solution = solveInput.value.toUpperCase().trim();
            if (!solution) {
                updateMessage('Please enter your solution!', 'error');
                return;
            }

            if (solution === currentPuzzle.phrase) {
                revealedLetters = new Set(currentPuzzle.phrase.replace(/\s/g, '').split(''));
                renderPuzzle();
                endRound(true);
            } else {
                updateMessage('❌ Wrong solution! Next team\'s turn!', 'error');
                solveInput.value = '';
                setTimeout(() => switchTeam(), 2000);
            }
        });

        // End Round
        function endRound(solved) {
            if (solved) {
                teams[currentTeam].totalScore += teams[currentTeam].roundScore;
                renderTeams();

                gameOver = true;
                spinButton.disabled = true;
                letterInput.disabled = true;
                guessButton.disabled = true;
                buyVowelButton.disabled = true;
                solveInput.disabled = true;
                solveButton.disabled = true;

                updateMessage(`🎉 ${teams[currentTeam].name} solved it and won $${teams[currentTeam].roundScore}!`, 'success');

                const winner = teams.reduce((prev, current) =>
                    (prev.totalScore > current.totalScore) ? prev : current
                );

                setTimeout(() => {
                    const gameOverDiv = document.createElement('div');
                    gameOverDiv.className = 'game-over';
                    gameOverDiv.innerHTML = `
                        <h2>🏆 GAME OVER! 🏆</h2>
                        <p style="font-size: 1.5em; margin-bottom: 20px;">${winner.name} wins with $${winner.totalScore}!</p>
                    `;
                    puzzleBoard.appendChild(gameOverDiv);
                }, 1000);
            }
        }

        // Letter Input Enter Key
        letterInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                guessButton.click();
            }
        });

        // Solve Input Enter Key
        solveInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                solveButton.click();
            }
        });

        // New Game
        newGameButton.addEventListener('click', () => {
            initGame();
        });

        // Start Game
        initGame();
    </script>
</body>
</html>
